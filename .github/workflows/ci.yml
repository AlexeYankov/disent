name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: npx tsc --noEmit

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_API_URL: https://restcountries.com/v3.1/
